# Builds and tests every push to main. A version tag (v1.0.0, matching src/AssemblyInfo.cs) also publishes
# a GitHub release with the HypaceTray.exe built here.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Test
        shell: pwsh
        run: |
          $result = & .\build\icontests.exe
          $code = $LASTEXITCODE
          $result | Where-Object { $_ -notmatch '^PASS  ' }
          if ($code -ne 0) { throw 'icontests failed' }

      - name: Check the version matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Item .\build\HypaceTray.exe).VersionInfo.ProductVersion
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME, but HypaceTray.exe is version $v (src/AssemblyInfo.cs)" }

      - uses: actions/upload-artifact@v4
        with:
          name: HypaceTray
          path: build/HypaceTray.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: HypaceTray

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(sha256sum HypaceTray.exe | cut -d' ' -f1)
          sed -e "s/{{TAG}}/$GITHUB_REF_NAME/g" -e "s/{{SHA256}}/$sha/g" .github/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" HypaceTray.exe --repo "$GITHUB_REPOSITORY" \
            --title "HypaceTray $GITHUB_REF_NAME" --notes-file notes.md
